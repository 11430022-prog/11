<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料分析互動系統</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="bg-body-tertiary">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <header class="text-center mb-4">
                            <div class="display-5 mb-3" aria-hidden="true">🌟</div>
                            <h1 class="h2 fw-bold text-primary mb-3">個人資料分析互動系統</h1>
                            <p class="text-secondary mb-0">
                                歡迎來到個人資料分析系統！<br>
                                請點擊下方按鈕，回答幾個簡單的問題，<br class="d-none d-sm-inline">
                                系統就會根據你的回答產生專屬分析結果。
                            </p>
                        </header>

                        <div class="d-grid col-sm-8 col-md-6 mx-auto mb-4">
                            <button type="button" class="btn btn-primary btn-lg" onclick="startAnalysis()">
                                開始分析
                            </button>
                        </div>

                        <section id="result" class="alert alert-info mb-0" aria-live="polite">
                            <h2 class="h5 alert-heading fw-bold">分析結果</h2>
                            <p class="mb-0">尚未開始分析，請點擊上方按鈕。</p>
                        </section>
                    </div>
                </section>

                <footer class="text-center text-secondary small mt-4">
                    JavaScript Interactive Project
                </footer>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
